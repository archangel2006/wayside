<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wayside – collect your walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 1. loading -->
<div class="loading" id="loading" role="status" aria-live="polite">
  <div class="ld">
    <div class="ld-box"><span id="ld-art"></span><div class="ld-tag"></div></div>
    <div class="ld-name">Wayside</div>
    <div class="ld-bar"><i></i></div>
    <div class="ld-msg" id="ld-msg">Waking the cutout model…</div>
    <button class="link" id="skip">Skip</button>
  </div>
</div>

<!-- 2. landing -->
<div class="landing" id="landing" hidden></div>

<!-- 3. app -->
<div class="shell" id="shell" hidden>
  <main id="app" tabindex="-1"></main>
  <nav class="tabs" aria-label="Main">
    <div class="brand" id="brand"></div>
    <button data-nav="collect"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Collect</span></button>
    <button data-nav="albums"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>Albums</span></button>
    <button data-nav="stories"><svg viewBox="0 0 24 24"><path d="M6 4h10a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2z"/><path d="M9.5 9h5M9.5 13h5"/></svg><span>Stories</span></button>
    <button data-nav="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Settings</span></button>
    <div class="side-foot">
      <div class="status-chip"><i></i>Open models: demo mode</div>
      <button class="link" id="about">About Wayside</button>
    </div>
  </nav>
</div>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>

<script type="module" src="js/main.js?v=2"></script>
</body>
</html>
